name: Deploy comments to Firebase Hosting

on:
  push:
    branches: [main, master]
    paths:
      - 'comments/daily/**'
      - '_headers'
      - '_routes.json'
      - '.github/workflows/deploy-comments-firebase-hosting.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: comments-data-firebase-hosting
  cancel-in-progress: true

env:
  FIREBASE_TOOLS_VERSION: "13.29.3"

permissions:
  contents: read

jobs:
  deploy:
    name: Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache npm (npx firebase-tools)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-firebase-${{ env.FIREBASE_TOOLS_VERSION }}
          restore-keys: |
            ${{ runner.os }}-npm-firebase-

      - name: Stage files for Hosting (public/comments/daily/*.json)
        run: |
          set -euo pipefail
          mkdir -p public/comments/daily
          if [ ! -d comments/daily ]; then
            echo "Missing comments/daily directory."
            exit 1
          fi
          shopt -s nullglob
          files=(comments/daily/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No comments/daily/*.json files to deploy."
            exit 1
          fi
          cp -v "${files[@]}" public/comments/daily/
          echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>Comments</title></head><body><p>Hosting for daily JSON.</p></body></html>' > public/index.html

      - name: Write firebase.json and .firebaserc
        run: |
          cat > firebase.json << 'EOF'
          {
            "hosting": {
              "public": "public",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "headers": [
                {
                  "source": "/comments/daily/**",
                  "headers": [
                    {
                      "key": "Cache-Control",
                      "value": "public, max-age=0, s-maxage=30"
                    }
                  ]
                }
              ]
            }
          }
          EOF
          echo '{"projects":{"default":"bib-kreyol-99d07"}}' > .firebaserc

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_TOKEN not set — skipping Firebase deploy."
            exit 0
          fi
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy --only hosting --project bib-kreyol-99d07 --non-interactive
