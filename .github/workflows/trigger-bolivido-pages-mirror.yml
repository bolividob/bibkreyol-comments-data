# Optional: after daily JSON lands on main, ask bolivido/bibkreyol-comments-pages to sync immediately
# (in addition to its 10-minute schedule). Requires repo secret:
#   BOLIVIDO_MIRROR_DISPATCH_TOKEN — classic PAT (repo scope) or fine-grained token with
#   Contents: Read and write on bolivido/bibkreyol-comments-pages, owned by bolivido user who created the token.

name: Trigger bolivido GitHub Pages mirror

on:
  push:
    branches: [main]
    paths:
      - 'comments/daily/**'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch to bolivido/bibkreyol-comments-pages
        env:
          TOKEN: ${{ secrets.BOLIVIDO_MIRROR_DISPATCH_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "Secret BOLIVIDO_MIRROR_DISPATCH_TOKEN not set — bolivido mirror relies on its schedule (every 10m) only."
            exit 0
          fi
          set -euo pipefail
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            https://api.github.com/repos/bolivido/bibkreyol-comments-pages/dispatches \
            -d '{"event_type":"sync-comments-data","client_payload":{}}'
          echo "Dispatched sync-comments-data to bolivido/bibkreyol-comments-pages"
