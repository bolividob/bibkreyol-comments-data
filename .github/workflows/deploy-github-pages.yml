# GitHub Pages static deploy — same **content** layout as:
#   • Firebase Hosting job (public/comments/daily/*.json + index.html)
#   • Cloudflare Pages (repo root: comments/daily/*.json, no Functions)
#
# Repo root `_headers` and `_routes.json` match BibKreyol docs for Cloudflare Pages when this
# same repo is connected there. GitHub Pages (github.io) does not interpret `_headers`; use
# Cloudflare or Firebase for CDN cache semantics. This workflow still publishes every daily JSON.

name: Deploy comments data to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'comments/daily/**'
      - '_headers'
      - '_routes.json'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

concurrency:
  group: github-pages-comments-data
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Mirror Firebase Hosting staging: public/comments/daily → here _site/comments/daily
      - name: Assemble static site (all daily JSON + index + nojekyll)
        run: |
          set -euo pipefail
          mkdir -p _site/comments/daily
          shopt -s nullglob
          files=(comments/daily/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No comments/daily/*.json files to publish."
            exit 1
          fi
          cp -v "${files[@]}" _site/comments/daily/
          echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>BibKreyol comments data</title></head><body><p>Static JSON for daily verse comments. Path: <code>comments/daily/</code> (same tree as Firebase Hosting + Cloudflare Pages).</p></body></html>' > _site/index.html
          : > _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
