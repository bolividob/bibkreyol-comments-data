# Publishes **only** `comments/daily/{UTC-yyyy-MM-dd}.json` for the **current UTC calendar day**
# to GitHub Pages — same key the BibKreyol app uses for verse-of-the-day comments
# (`GET {base}/comments/daily/{todayUtc}.json`). Historical days stay on GitHub raw / Firebase;
# Pages stays minimal and fast.
# (Parallel to Firebase Hosting deploy in deploy-comments-data-to-hosting.yml, which still ships all files.)

name: Deploy comments data to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'comments/daily/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

concurrency:
  group: github-pages-comments-data
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble static site (UTC today only)
        run: |
          set -euo pipefail
          mkdir -p _site/comments/daily
          TODAY=$(date -u +%Y-%m-%d)
          SRC="comments/daily/${TODAY}.json"
          if [ ! -f "$SRC" ]; then
            echo "Missing file for current UTC day (verse-of-the-day key): $SRC"
            exit 1
          fi
          cp -v "$SRC" "_site/comments/daily/${TODAY}.json"
          echo "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\"/><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"/><title>BibKreyol comments data</title></head><body><p>Static JSON (UTC today only): <code>comments/daily/${TODAY}.json</code></p></body></html>" > _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
