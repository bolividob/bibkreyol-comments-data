name: Deploy comments to Cloudflare Pages (static)

on:
  push:
    branches: [main, master]
    paths:
      - 'comments/daily/**'
      - '_headers'
      - '_routes.json'
      - '.github/workflows/deploy-cloudflare-pages-static.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-comments-static
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 94d7c107ecf86d8e301bd95a3be50f28
      CLOUDFLARE_PROJECT_NAME: bibkreyol-comments-read-static-2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure static root index exists
        run: |
          if [ ! -f index.html ]; then
            echo '<!doctype html><html><body><p>BibKreyol comments static mirror.</p></body></html>' > index.html
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping Cloudflare deploy."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy . \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch main \
            --commit-dirty=true
