# Single workflow for bibkreyol-comments-data: Firebase Hosting + GitHub Pages + optional bolivido mirror.
# Replaces three separate workflows so one push to comments/daily does not triple Actions noise.
#
# Required secret: FIREBASE_TOKEN (Firebase deploy only — job skips if unset)
# Optional secret: BOLIVIDO_MIRROR_DISPATCH_TOKEN (repository_dispatch to bolivido mirror)

name: Deploy comments (Firebase + GitHub Pages + mirror)

on:
  push:
    branches: [main, master]
    paths:
      - 'comments/daily/**'
      - '_headers'
      - '_routes.json'
      - '.github/workflows/deploy-comments-hosting-and-pages.yml'
  workflow_dispatch:

concurrency:
  group: comments-data-deploy-bundle
  cancel-in-progress: true

env:
  FIREBASE_TOOLS_VERSION: "13.29.3"

jobs:
  firebase_hosting:
    name: Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache npm (npx firebase-tools)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-firebase-${{ env.FIREBASE_TOOLS_VERSION }}
          restore-keys: |
            ${{ runner.os }}-npm-firebase-

      - name: Stage files for Hosting (public/comments/daily/*.json)
        run: |
          set -euo pipefail
          mkdir -p public/comments/daily
          if [ ! -d comments/daily ]; then
            echo "Missing comments/daily directory."
            exit 1
          fi
          shopt -s nullglob
          files=(comments/daily/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No comments/daily/*.json files to deploy."
            exit 1
          fi
          cp -v "${files[@]}" public/comments/daily/
          echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>Comments</title></head><body><p>Hosting for daily JSON.</p></body></html>' > public/index.html

      - name: Write firebase.json and .firebaserc
        run: |
          cat > firebase.json << 'EOF'
          {
            "hosting": {
              "public": "public",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "headers": [
                {
                  "source": "/comments/daily/**",
                  "headers": [
                    {
                      "key": "Cache-Control",
                      "value": "public, max-age=0, s-maxage=30"
                    }
                  ]
                }
              ]
            }
          }
          EOF
          echo '{"projects":{"default":"bib-kreyol-99d07"}}' > .firebaserc

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_TOKEN not set — skipping Firebase deploy."
            exit 0
          fi
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy --only hosting --project bib-kreyol-99d07 --non-interactive

  github_pages:
    name: GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble static site (all daily JSON + index + nojekyll)
        run: |
          set -euo pipefail
          mkdir -p _site/comments/daily
          shopt -s nullglob
          files=(comments/daily/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No comments/daily/*.json files to publish."
            exit 1
          fi
          cp -v "${files[@]}" _site/comments/daily/
          echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>BibKreyol comments data</title></head><body><p>Static JSON for daily verse comments. Path: <code>comments/daily/</code></p></body></html>' > _site/index.html
          : > _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

  bolivido_mirror_dispatch:
    name: Notify bolivido mirror
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: repository_dispatch to bolivido/bibkreyol-comments-pages
        env:
          TOKEN: ${{ secrets.BOLIVIDO_MIRROR_DISPATCH_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "BOLIVIDO_MIRROR_DISPATCH_TOKEN not set — skipping."
            exit 0
          fi
          set -euo pipefail
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            https://api.github.com/repos/bolivido/bibkreyol-comments-pages/dispatches \
            -d '{"event_type":"sync-comments-data","client_payload":{}}'
          echo "Dispatched sync-comments-data to bolivido/bibkreyol-comments-pages"
